version: '3.8'

services:
  db:
    image: postgres:15
    container_name: careerpath_db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=sifre123
      - POSTGRES_DB=CareerPathDb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

volumes:
  postgres_data:
